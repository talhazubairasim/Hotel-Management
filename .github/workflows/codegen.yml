# Temporary: creates the initial EF Core migration on GitHub (the .NET SDK is
# not available where this branch was written) and commits it.
name: Codegen

on:
  push:
    branches: [fix/make-readme-true]
    paths: [".github/workflows/codegen.yml"]

permissions:
  contents: write

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool install --global dotnet-ef --version 9.0.9
      - name: Build and add migration
        run: |
          dotnet build Assignment.sln 2>&1 | tee build.log
          cd Assignment
          if [ ! -d Migrations ]; then dotnet ef migrations add InitialCreate --output-dir Migrations 2>&1 | tee -a ../build.log; fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assignment/Migrations build.log
          git commit -m "Add initial EF Core migration" || echo "nothing to commit"
          git push
